
      # Build Angular application
      - name: Build Angular app
        run: npm run build

      # Verify Angular build
      - name: Verify web build
        run: test -f dist/my-english-buddy/browser/index.html

      # Generate Android assets
      - name: Generate Android assets
        run: npx capacitor-assets generate --android

      # Configure Android permissions
      - name: Configure Android permissions
        run: npm run android:setup

      # Update existing Android project
      - name: Sync Android project
        run: npx cap sync android

      # Build APK
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # Upload APK
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Lela-English-Companion-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
