
name: Build Lela Android APK

'on':
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'data-src/**'
      - 'resources/**'
      - 'android/**'
      - 'package.json'
      - 'angular.json'
      - 'capacitor.config.ts'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Lela Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check existing Android project
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            echo "ERROR: Existing Android project or AndroidManifest.xml is missing."
            exit 1
          fi
          echo "Existing Android project found."

      - name: Check project data
        run: |
          npm run data:check
          npm run db:check

      - name: Build Angular application
        run: npm run build

      - name: Verify Angular build
        run: |
          test -f dist/my-english-buddy/browser/index.html
          echo "Angular build completed."

      - name: Generate Android assets
        run: npm run android:assets

      - name: Configure Android permissions
        run: npm run android:setup

      - name: Sync existing Capacitor Android project
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK generated successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lela-English-Companion-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
